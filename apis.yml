description: LawnGuru is a lawn and landscape services marketplace that connects homeowners
  with vetted local service providers through a mobile-first platform. It offers instant
  pricing via aerial property mapping, real-time job tracking, and a satisfaction guarantee,
  spanning 17+ outdoor services including lawn mowing, snow clearing, yard cleanup, weeding,
  hedge trimming, gutter cleaning, tree work, seeding, aeration, mulch installation, pressure
  washing, sprinkler services, and junk removal. The company reports over 1,000,000 completed
  jobs. As of this enrichment pass, LawnGuru publishes no public developer API, developer
  portal, or API documentation.
